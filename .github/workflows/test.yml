# push / PR ごとに回帰テストと構文チェックを実行する。
# 本ツールは Windows 専用で、PowerShell スクリプトの検査を含むテストがあるため
# windows-latest で実行する。npm 依存が無いので npm install は不要。
# アクションはメジャータグで参照する（パッチ追従はタグの更新に任せる）。
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチの古い実行は打ち切る（push を重ねたときに無駄に並走させない）
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 は package.json の engines（>=20）の最小保証、24 は現行 LTS の互換確認
        node-version: ['20.x', '24.x']
    name: test (Node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Windows の PowerShell は src/**/*.js を再帰展開せず、node --check も
      # 1 ファイルずつしか検査できないため、列挙してループする
      - name: 構文チェック (node --check)
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Include *.js, *.mjs -Path src, scripts, tools, test |
            Select-Object -ExpandProperty FullName
          $failed = 0
          foreach ($f in $files) {
            node --check $f
            if ($LASTEXITCODE -ne 0) { $failed += 1 }
          }
          if ($failed -gt 0) {
            Write-Error "$failed 件のファイルで構文エラーがあります"
            exit 1
          }
          Write-Host "$($files.Count) 件のファイルを検査しました"

      - name: テスト (npm test)
        run: npm test
